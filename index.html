<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중3 역사 - 조선 전기 인물 도감</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>📜 조선 전기 인물 탐험</h1>
            <p>중학교 3학년 역사 교과서 속 핵심 인물들을 만나보세요!</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="인물 이름이나 업적을 검색해보세요 (예: 세종, 한글, 과학)">
            </div>
        </div>
    </header>

    <main>
        <section id="characterGrid" class="card-grid">
            <!-- 자바스크립트로 카드가 동적으로 생성됩니다 -->
        </section>
    </main>

    <!-- 상세 정보 모달창 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalName">인물 이름</h2>
            <h3 id="modalTitle" class="modal-subtitle">관직 및 별칭</h3>
            <div class="modal-body">
                <p><strong>대표 업적:</strong> <span id="modalAchievement"></span></p>
                <p><strong>상세 설명:</strong> <span id="modalDescription"></span></p>
                <p class="trivia">💡 <strong>역사 쑥쑥 TMI:</strong> <span id="modalTrivia"></span></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 중3 역사 교육용 웹앱</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
